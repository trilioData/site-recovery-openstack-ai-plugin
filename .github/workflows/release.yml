# Runs on a tag such as site-recovery-openstack/0.2.0: checks the tag matches
# plugin.yaml, builds the generic-agent zip and publishes a GitHub release.
name: release

on:
  push:
    tags: ["*/[0-9]*"]

permissions:
  contents: write

env:
  KIT_REF: 0.1.0  # kit pin: keep equal in ci.yml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: trilioData/trilio-agent-plugin-kit
          ref: ${{ env.KIT_REF }}
          token: ${{ secrets.PLUGINKIT_TOKEN }}
          path: .pluginkit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Parse tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%/*}"
          version="${tag##*/}"
          if [ ! -f "plugins/$name/plugin.yaml" ]; then
            echo "::error::Tag $tag does not match a folder under plugins/"; exit 1
          fi
          declared=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['version'])" "plugins/$name/plugin.yaml")
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag says $version but plugins/$name/plugin.yaml says $declared"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: python .pluginkit/pluginkit.py validate .
      - run: python .pluginkit/pluginkit.py generate --check .
      - run: python .pluginkit/pluginkit.py package "plugins/${{ steps.tag.outputs.name }}" --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "${{ steps.tag.outputs.name }} ${{ steps.tag.outputs.version }}" \
            --notes "Built with trilio-agent-plugin-kit $KIT_REF. Add it to trilio-agent-marketplace with: pluginkit pin . ${{ steps.tag.outputs.name }} $GITHUB_REF_NAME"
